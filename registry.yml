# IES Ontology Module Registry
# This file provides a machine-readable index of all published IES ontology modules
#
# Module Structure:
#   docs/{domain}/{module}/   - Domain-specific modules
#   docs/common/              - Foundational module (no domain prefix)
#
# Versioning:
#   - Module releases: Git tags using format {module-id}/v{version}
#   - Release candidates: {module-id}/v{version}-rcN
#   - Composite releases: ies-release-{yyyy.mm}

modules:
  common:
    name: IES Common
    domain: ~  # Foundational module, no specific domain
    path: docs/common
    latest_version: "5.1.0-rc2"
    status: release candidate
    namespace: "http://informationexchangestandard.org/ont/ies/common/"
    description: >
      The foundational IES ontology providing core classes and properties
      for 4D extensional modelling of entities, states, and events.
    dependencies: []

  building:
    name: IES Building
    domain: environment
    path: docs/environment/building
    latest_version: "1.0.0-rc2"
    status: development
    namespace: "http://informationexchangestandard.org/ont/ies/environment/building/"
    description: >
      Ontology module for describing buildings, structures, and their
      spatial and functional characteristics. Extends IES Common with
      classes and properties for modelling building elements, spaces,
      systems, and their relationships within the built environment.
    dependencies:
      - id: common
        min_version: "5.0.0"

# Composite releases document tested combinations of modules
# These are tagged with format: ies-release-{yyyy.mm}
composite_releases: []

# Compatibility matrix documenting which module versions are tested together
# (None yet - will be added as modules are released together)
compatibility_matrix: []
